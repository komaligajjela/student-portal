{% extends 'students/base.html' %}

{% block content %}

<div class="row justify-content-center">

<div class="col-md-6">

<div class="card-box">

<h2 class="heading">Add Student</h2>

<form method="POST" enctype="multipart/form-data">

    {% csrf_token %}

    {{ form.as_p }}

        Save Student

</form>

</div>

</div>

</div>

{% endblock %}

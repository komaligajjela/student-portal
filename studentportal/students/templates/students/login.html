{% extends 'students/base.html' %}

{% block content %}

<div class="row justify-content-center">

<div class="col-md-4">

<div class="card-box">

<h2 class="heading">Login</h2>

<form method="POST">

{% csrf_token %}

<input type="text"
       name="username"
       class="form-control mb-3"
       placeholder="Username">

<input type="password"
       name="password"
       class="form-control mb-3"
       placeholder="Password">

<button class="btn btn-primary w-100">

Login

</button>

</form>

</div>

</div>

</div>

{% endblock %}
